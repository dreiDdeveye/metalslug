// ═══════════════════════════════════════════════════════════════
// PIXEL ART RENDERER — draw sprites with 3-pixel scale
// ═══════════════════════════════════════════════════════════════
const PX = 3; // pixel size

function px(ctx, x, y, color, pw=1, ph=1) {
  ctx.fillStyle = color;
  ctx.fillRect(x*PX, y*PX, pw*PX, ph*PX);
}

// Pre-render sprites to offscreen canvases
function makeSprite(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w*PX; c.height = h*PX;
  const ctx = c.getContext('2d');
  fn(ctx);
  return c;
}

// ═══════════════════════════════════════════════════════════════
// GAME ENGINE — pure vanilla, no frameworks
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── FULLSCREEN ────────────────────────────────────────────────
// World units are fixed. SCALE = pixels per world unit, derived from window.
const WORLD_W  = 4800;
const WORLD_H  = 160;   // world height in world units
const GROUND_Y = 135;   // ground surface in world units
const GRAVITY  = 900;

let W, H, SCALE;

function resizeCanvas(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;
  SCALE = H / WORLD_H;  // fill full height
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Input
const keys = {};
const justPressed = {};
const justReleased = {};
window.addEventListener('keydown', e => {
  if(!keys[e.code]) justPressed[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code]=false;
  justReleased[e.code]=true;
});
function clearJust(){ for(const k in justPressed) delete justPressed[k]; for(const k in justReleased) delete justReleased[k]; }

// ── ENTITY BASE ─────────────────────────────────────────────────
class Entity {
  constructor(x,y,w,h){
    this.x=x; this.y=y; this.w=w; this.h=h;
    this.vx=0; this.vy=0; this.onGround=false; this.alive=true;
  }
  get cx(){ return this.x+this.w/2; }
  get cy(){ return this.y+this.h/2; }
  get right(){ return this.x+this.w; }
  get bottom(){ return this.y+this.h; }
  overlaps(o){
    return this.x<o.x+o.w && this.right>o.x && this.y<o.y+o.h && this.bottom>o.y;
  }
  // Apply gravity + move, then resolve against platform list
  physicsStep(dt, platforms){
    this.vy += GRAVITY*dt;
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    this.onGround = false;
    // Clamp world X
    if(this.x<0){ this.x=0; this.vx=0; }
    if(this.right>WORLD_W){ this.x=WORLD_W-this.w; this.vx=0; }
    // Resolve platforms (simple AABB, top-only for one-way & solid)
    for(const p of platforms){
      if(this.overlaps(p)){
        const overlapTop = p.y - this.bottom;
        const overlapBot = p.y+p.h - this.y;
        const overlapL   = this.right - p.x;
        const overlapR   = p.x+p.w - this.x;
        const minV = Math.min(Math.abs(overlapTop),Math.abs(overlapBot),Math.abs(overlapL),Math.abs(overlapR));
        if(!p.solid){
          // one-way: only resolve from above
          if(this.vy>=0 && Math.abs(overlapTop)<8){
            this.y=p.y-this.h; this.vy=0; this.onGround=true;
          }
        } else {
          if(minV===Math.abs(overlapTop) && this.vy>=0){ this.y=p.y-this.h; this.vy=0; this.onGround=true; }
          else if(minV===Math.abs(overlapBot) && this.vy<0){ this.y=p.y+p.h; this.vy=0; }
          else if(minV===Math.abs(overlapL)){ this.x=p.x-this.w; this.vx=0; }
          else if(minV===Math.abs(overlapR)){ this.x=p.x+p.w; this.vx=0; }
        }
      }
    }
  }
}

// ── PLAYER ─────────────────────────────────────────────────────
class Player extends Entity {
  constructor(x,y){
    super(x,y,14,22);
    this.hp=3; this.grenades=5; this.facing=1;
    this.frame=0; this.frameTimer=0;
    this.invTimer=0; this.shootTimer=0;
    this.state='stand'; // stand run jump duck
    this.inTank=false;
  }
  update(dt, platforms, game){
    if(this.inTank) return;
    this.invTimer = Math.max(0, this.invTimer-dt);
    this.shootTimer = Math.max(0, this.shootTimer-dt);

    const left  = keys['ArrowLeft']  || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const up    = keys['ArrowUp']    || keys['KeyW'];
    const down  = keys['ArrowDown'];
    const shoot = keys['KeyZ']       || keys['Space'];
    const grenade = justPressed['KeyX'];
    const jumpPressed = justPressed['ArrowUp'] || justPressed['KeyW'];

    // Duck
    const ducking = down && this.onGround;
    this.w = ducking ? 14 : 14;
    this.h = ducking ? 16 : 22;

    // Move
    if(left)       { this.vx=-140; this.facing=-1; }
    else if(right) { this.vx=140;  this.facing=1; }
    else            { this.vx=0; }

    // Jump
    if(jumpPressed && this.onGround && !ducking) this.vy=-370;

    // Board tank
    if(jumpPressed && game.tank && game.tank.alive){
      const dx = Math.abs(this.cx - game.tank.cx);
      const dy = Math.abs(this.cy - game.tank.cy);
      if(dx<60 && dy<50){ game.boardTank(); return; }
    }

    this.physicsStep(dt, platforms);

    // Shoot
    if(shoot && this.shootTimer<=0){
      this.shootTimer=0.11;
      game.spawnBullet(this.cx+this.facing*8, this.cy-3, this.facing*620, 0, false);
    }
    // Grenade
    if(grenade && this.grenades>0){
      this.grenades--;
      game.spawnGrenade(this.cx, this.cy-8, this.facing*-260, -280);
    }

    // Anim state
    if(!this.onGround) this.state='jump';
    else if(ducking)   this.state='duck';
    else if(this.vx!==0) this.state='run';
    else                 this.state='stand';

    if(this.state==='run'){
      this.frameTimer+=dt;
      if(this.frameTimer>0.12){ this.frameTimer=0; this.frame=1-this.frame; }
    }
  }
  hit(game){ if(this.invTimer>0) return; this.hp--; this.invTimer=1.5; if(this.hp<=0) game.playerDead(); }
  draw(cam){
    if(!this.alive) return;
    if(this.invTimer>0 && Math.floor(this.invTimer*10)%2===0) return;

    const charImg = window._charImg;
    const useImg  = charImg && charImg.naturalWidth>0;

    const sx = (this.x - cam.x) * SCALE;
    const sy = (this.y - cam.y) * SCALE;

    ctx.save();

    if(useImg){
      const aspect = charImg.naturalWidth / charImg.naturalHeight;

      // Enemy pixel sprite = 54×78 canvas px, hitbox 14×22 world = 28×44 canvas
      // Sprite overhangs hitbox by (78-44)/44 = 0.77 on height
      // Mirror that: image height = hitbox height * (78/44) = * 1.773
      const ih = this.h * SCALE * 1.773;
      const iw = ih * aspect;

      // Draw from same Y as pixel sprite (hitbox top = sy), centred on hitbox X
      const drawY   = sy;
      const centreX = sx + (this.w * SCALE) / 2;

      ctx.imageSmoothingEnabled = false;

      if(this.facing < 0){
        ctx.translate(centreX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(charImg, -iw/2, drawY, iw, ih);
      } else {
        ctx.drawImage(charImg, centreX - iw/2, drawY, iw, ih);
      }

    } else {
      // fallback: original pixel sprites
      let spr;
      switch(this.state){
        case 'run':  spr = this.frame ? SPRITES.pRun2 : SPRITES.pRun1; break;
        case 'jump': spr = SPRITES.pJump; break;
        case 'duck': spr = SPRITES.pDuck; break;
        default:     spr = SPRITES.pStand;
      }
      if(this.facing < 0){
        ctx.scale(-1,1);
        ctx.drawImage(spr, -sx - spr.width, sy);
      } else {
        ctx.drawImage(spr, sx, sy);
      }
    }

    ctx.restore();
  }
}

// ── ENEMY ──────────────────────────────────────────────────────
class Enemy extends Entity {
  constructor(x,y){
    super(x,y,14,22);
    this.hp=2; this.dir=-1; this.patrolTimer=1+Math.random()*2;
    this.state='patrol'; this.shootTimer=1.5+Math.random()*1.5;
    this.frame=0; this.frameTimer=0;
    this.imgIdx = Math.floor(Math.random()*3); // 0,1,2 — random enemy skin
  }
  update(dt, platforms, game){
    const px = game.player.inTank ? game.tank.cx : game.player.cx;
    const dist = Math.abs(px - this.cx);
    if(dist<350) this.state='chase';
    else if(dist>420) this.state='patrol';

    if(this.state==='patrol'){
      this.patrolTimer-=dt;
      if(this.patrolTimer<=0){ this.dir*=-1; this.patrolTimer=1.2+Math.random()*2; }
      this.vx=this.dir*55;
    } else {
      this.dir=px>this.cx?1:-1;
      this.vx=this.dir*75;
      this.shootTimer-=dt;
      if(this.shootTimer<=0 && dist>50 && dist<300){
        this.shootTimer=1.6+Math.random()*1.2;
        game.spawnBullet(this.cx-this.dir*8, this.cy-5, -this.dir*370, 0, true);
      }
    }
    this.frameTimer+=dt;
    if(this.frameTimer>0.14){ this.frameTimer=0; this.frame=1-this.frame; }
    this.physicsStep(dt, platforms);
  }
  draw(cam){
    const sx=(this.x-cam.x)*SCALE, sy=(this.y-cam.y)*SCALE;
    ctx.save();

    const arr = window._enemyImgArr;
    const enemyImg = arr && arr[this.imgIdx] && arr[this.imgIdx].naturalWidth>0
      ? arr[this.imgIdx] : null;

    if(enemyImg){
      const aspect = enemyImg.naturalWidth / enemyImg.naturalHeight;
      const ih = this.h * SCALE * 1.773;
      const iw = ih * aspect;
      const centreX = sx + (this.w*SCALE)/2;
      ctx.imageSmoothingEnabled = false;
      // image faces right by default — flip when moving left
      if(this.dir < 0){
        ctx.translate(centreX,0); ctx.scale(-1,1);
        ctx.drawImage(enemyImg,-iw/2,sy,iw,ih);
      } else {
        ctx.drawImage(enemyImg,centreX-iw/2,sy,iw,ih);
      }
    } else {
      const spr = this.frame ? SPRITES.eWalk2 : SPRITES.eWalk1;
      if(this.dir>0){ ctx.scale(-1,1); ctx.drawImage(spr,-sx-spr.width,sy); }
      else ctx.drawImage(spr,sx,sy);
    }

    ctx.restore();
  }
}

// ── TANK ───────────────────────────────────────────────────────
class Tank extends Entity {
  constructor(x,y){ super(x,y,36,16); this.shootTimer=0; }
  update(dt,platforms,game){
    const left=keys['ArrowLeft']||keys['KeyA'], right=keys['ArrowRight']||keys['KeyD'];
    const shoot=keys['KeyZ']||keys['Space'];
    const exit=justPressed['ArrowUp']||justPressed['KeyW'];
    this.vx=left?-180:right?180:0;
    this.shootTimer=Math.max(0,this.shootTimer-dt);
    if(shoot && this.shootTimer<=0){ this.shootTimer=0.3; game.spawnBullet(this.right,this.cy-4,720,0,false,true); }
    if(exit){ game.exitTank(); }
    this.physicsStep(dt,platforms);
  }
  draw(cam){
    const sx=(this.x-cam.x)*SCALE, sy=(this.y-cam.y)*SCALE;
    const tankImg = window._tankImg;
    if(tankImg && tankImg.naturalWidth>0){
      ctx.imageSmoothingEnabled=false;
      const tw = this.w * SCALE * 2.5;
      const th = tw * (tankImg.naturalHeight / tankImg.naturalWidth);
      const cx2 = (this.x + this.w/2 - cam.x) * SCALE;
      const footOffset = th * 0.30;
      const groundY = (this.y + this.h - cam.y) * SCALE;
      const tx = cx2 - tw/2;
      const ty = groundY - th + footOffset;
      ctx.drawImage(tankImg, tx, ty, tw, th);
    } else {
      ctx.drawImage(SPRITES.tank, sx, sy);
    }
  }
}

// ── FINAL BOSS ─────────────────────────────────────────────────
class Boss2 extends Entity {
  constructor(x,y){
    super(x,y,36,50);
    this.hp=100; this.maxHp=100;        // up from 60
    this.dir=-1; this.facing=-1;
    this.shootTimer=0.5;                // up from 0.8
    this.grenadeTimer=1.2;              // up from 1.8
    this.dashTimer=2.0;                 // up from 3.0
    this.teleportTimer=5.0;             // up from 8.0
    this.shieldTimer=0;
    this.shieldCd=8.0;                  // up from 15.0 — shields more often
    this.minionTimer=12.0;              // up from 20.0
    this.rocketTimer=4.0;               // NEW — rocket barrage
    this.burstTimer=0;                  // NEW — burst fire mode
    this.burstCount=0;
    this.enrageTimer=0;                 // NEW — enrage on low HP
    this.alive=true;
    this.narrativeDone=false;
    this.phase=1;
    this.glowPulse=0;
  }

  getPhase(){ const r=this.hp/this.maxHp; return r>0.66?1:r>0.33?2:3; }

  update(dt,platforms,game){
    const newPhase=this.getPhase();
    if(newPhase!==this.phase && newPhase > this.phase){
      this.phase=newPhase;
      const msgs={2:'OVERCLOCKING — PHASE 2 INITIATED!',3:'CRITICAL MASS — FULL POWER ENGAGED!'};
      if(msgs[newPhase]) game.showNarrative(msgs[newPhase],'#ff4400');
      game.shakeTimer=0.8; game.shakeMag=12;
    }

    const px=game.player.inTank?game.tank.cx:game.player.cx;
    const dist=Math.abs(px-this.cx);
    this.facing=px>this.cx?1:-1;
    this.dir=this.facing;
    this.glowPulse+=dt*3;

    // ── SHIELD ── more frequent in higher phases
    const isShielded=this.shieldTimer>0;
    if(isShielded) this.shieldTimer-=dt;
    this.shieldCd=Math.max(0,this.shieldCd-dt);
    const shieldCooldown=this.phase===3?5:this.phase===2?7:10;
    const shieldDuration=this.phase===3?3.5:2.5;
    if(this.shieldCd<=0){
      this.shieldTimer=shieldDuration; this.shieldCd=shieldCooldown;
      game.showNarrative('SHIELD ACTIVATED!','#00ccff');
      game.floats.push(new FloatText(this.cx,this.y-20,'SHIELD!','#00ccff'));
    }

    // ── MOVEMENT — aggressive, zigzag in phase 3 ──
    const speed=this.phase===3?140:this.phase===2?95:65;
    this.vx=dist>40?this.dir*speed:0;
    if(this.phase===3) this.vx+=Math.sin(this.glowPulse*2.5)*60;
    if(this.phase>=2) this.vx+=Math.sin(this.glowPulse*0.8)*25;

    // ── SHOOT — burst fire in phase 2+ ──
    this.shootTimer-=dt;
    const sc=this.phase===3?0.18:this.phase===2?0.32:0.55;
    if(this.shootTimer<=0&&dist<1000){
      this.shootTimer=sc;
      const bx=this.dir>0?this.right:this.x;
      const by=this.cy-10;
      const spd=this.phase===3?520:this.phase===2?460:400;
      game.spawnBullet(bx,by,this.dir*spd,0,true);
      game.spawnBullet(bx,by,this.dir*spd,-120,true);
      if(this.phase>=2){
        game.spawnBullet(bx,by,this.dir*spd,120,true);
        game.spawnBullet(bx,by,this.dir*spd,-240,true);
      }
      if(this.phase===3){
        game.spawnBullet(bx,by,this.dir*spd,240,true);
        game.spawnBullet(bx,by,this.dir*spd,-60,true);
        game.spawnBullet(bx,by,this.dir*spd,60,true);
      }
    }

    // ── GRENADES ── faster and more ──
    this.grenadeTimer-=dt;
    const gc=this.phase===3?0.6:this.phase===2?1.0:1.8;
    if(this.grenadeTimer<=0&&dist<800){
      this.grenadeTimer=gc;
      const gvx=this.dir*(180+Math.random()*120);
      game.spawnGrenade(this.cx,this.cy-10,gvx,-380);
      game.spawnGrenade(this.cx,this.cy-10,gvx*0.7,-300);
      if(this.phase>=2) game.spawnGrenade(this.cx,this.cy-10,gvx*1.2,-340);
      if(this.phase===3) game.spawnGrenade(this.cx,this.cy-10,gvx*0.4,-260);
    }

    // ── ROCKET BARRAGE (phase 2+) — volleys of fast bullets in an arc ──
    this.rocketTimer-=dt;
    const rc=this.phase===3?2.5:4.0;
    if(this.rocketTimer<=0&&this.phase>=2&&dist<900){
      this.rocketTimer=rc;
      const bx=this.dir>0?this.right:this.x;
      const rspd=this.phase===3?580:480;
      for(let a=-3;a<=3;a++){
        game.spawnBullet(bx,this.cy-5,this.dir*rspd,a*70,true);
      }
      game.floats.push(new FloatText(this.cx,this.y-25,'ROCKET BARRAGE!','#ff8800'));
      game.shakeTimer=0.4; game.shakeMag=7;
    }

    // ── DASH — faster and more frequent ──
    this.dashTimer-=dt;
    const dc=this.phase===3?1.2:this.phase===2?2.0:3.5;
    if(this.dashTimer<=0&&dist<500&&dist>40){
      this.dashTimer=dc; this.vx=this.dir*(this.phase===3?500:400);
      game.floats.push(new FloatText(this.cx,this.y-20,'DASH!','#ff4400'));
    }

    // ── TELEPORT — much more frequent ──
    this.teleportTimer-=dt;
    const tc=this.phase===3?3:this.phase===2?5:999;
    if(this.teleportTimer<=0&&this.phase>=2){
      this.teleportTimer=tc;
      const newX=this.facing>0 ? Math.min(3100,px+200) : Math.max(50,px-200);
      for(let i=0;i<4;i++) game.explosions.push(new Explosion(this.cx+(Math.random()-0.5)*30,this.cy));
      this.x=newX; this.y=GROUND_Y-this.h;
      for(let i=0;i<4;i++) game.explosions.push(new Explosion(this.cx+(Math.random()-0.5)*30,this.cy));
      game.floats.push(new FloatText(this.cx,this.y-25,'TELEPORT!','#ff4400'));
      game.shakeTimer=0.3; game.shakeMag=8;
    }

    // ── SPAWN MINIONS ── more often, stronger ──
    this.minionTimer-=dt;
    if(this.minionTimer<=0&&this.phase>=2){
      this.minionTimer=this.phase===3?6:10;
      const count=this.phase===3?4:2;
      for(let i=0;i<count;i++){
        const spawnDir=this.cx>px?1:-1;
        const ex=this.cx+spawnDir*(80+i*70);
        const e=new Enemy(ex,GROUND_Y-22);
        e.hp=this.phase===3?3:2;
        game.enemies.push(e);
      }
      game.floats.push(new FloatText(this.cx,this.y-30,'SUMMONING MINIONS!','#ff4444'));
      game.showNarrative('MINIONS INCOMING!','#ff4444');
    }

    this.physicsStep(dt,platforms);
  }

  hit(game){
    if(this.shieldTimer>0){
      game.floats.push(new FloatText(this.cx,this.y-15,'BLOCKED!','#00ccff'));
      game.shakeTimer=0.1; game.shakeMag=3;
      return; // no damage
    }
    this.hp--;
    game.floats.push(new FloatText(this.cx,this.y-10,'-1','#00ff88'));
    if(this.hp<=0){
      this.alive=false;
      game.score+=10000;
      for(let i=0;i<10;i++) game.explosions.push(new Explosion(
        this.cx+(Math.random()-0.5)*60, this.cy+(Math.random()-0.5)*40
      ));
      game.floats.push(new FloatText(this.cx,this.y-40,'EXPERIMENT TERMINATED! +10000','#ffe94d'));
      game.showNarrative('EXPERIMENT TERMINATED. ALL CLEAR.','#00ff88');
      game.shakeTimer=1.5; game.shakeMag=12;
      setTimeout(()=>{ game.state='win'; showOverlay('MISSION\nCOMPLETE','SCORE: '+game.score+'\nPRESS ENTER TO PLAY AGAIN'); },2500);
    }
  }

  draw(cam){
    if(!this.alive) return;
    const sx=(this.x-cam.x)*SCALE, sy=(this.y-cam.y)*SCALE;
    const bossImg=window._boss2Img;
    const pulse=0.85+0.15*Math.abs(Math.sin(this.glowPulse));

    ctx.save();
    ctx.shadowColor=this.shieldTimer>0?'#00ccff':'#ff3300';
    ctx.shadowBlur=24*pulse;

    if(bossImg&&bossImg.naturalWidth>0){
      ctx.imageSmoothingEnabled=true;
      const aspect=bossImg.naturalWidth/bossImg.naturalHeight; // ~1.3 wide
      // Size: base height on world hitbox, scale up visually
      const ih = this.h * SCALE * 2.8;
      const iw = ih * aspect;
      // Center horizontally on hitbox, align bottom to ground
      const cx2 = (this.x + this.w/2 - cam.x) * SCALE;
      const groundY = (this.y + this.h - cam.y) * SCALE;
      const drawY = groundY - ih * 0.82; // image has some bottom padding
      // Image faces RIGHT by default — flip when facing left
      if(this.facing < 0){
        ctx.translate(cx2, 0); ctx.scale(-1, 1);
        ctx.drawImage(bossImg, -iw/2, drawY, iw, ih);
      } else {
        ctx.drawImage(bossImg, cx2 - iw/2, drawY, iw, ih);
      }
    } else {
      ctx.fillStyle=`hsl(${0+Math.sin(this.glowPulse)*20},100%,35%)`;
      ctx.fillRect(sx,sy,this.w*SCALE,this.h*SCALE);
    }
    ctx.shadowBlur=0;

    // Shield bubble
    if(this.shieldTimer>0){
      const alpha=Math.min(1,this.shieldTimer)*0.5;
      ctx.strokeStyle=`rgba(0,200,255,${alpha})`;
      ctx.lineWidth=3;
      const cr=(this.w*SCALE)/2+12;
      ctx.beginPath();
      ctx.arc(sx+this.w*SCALE/2, sy+this.h*SCALE/2, cr*(0.95+0.05*Math.sin(this.glowPulse*4)), 0, Math.PI*2);
      ctx.stroke();
      ctx.fillStyle=`rgba(0,200,255,${alpha*0.3})`;
      ctx.fill();
    }
    ctx.restore();

    // HP bar
    const barW=Math.round(SCALE*70), barH=Math.round(SCALE*4);
    const bx=(this.x+this.w/2-cam.x)*SCALE-barW/2;
    const by2=sy-barH-Math.round(SCALE*3);
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(bx,by2,barW,barH);
    const ratio=Math.max(0,this.hp/this.maxHp);
    ctx.fillStyle=ratio>0.66?'#ff4400':ratio>0.33?'#ff8800':'#ff0000';
    ctx.fillRect(bx+1,by2+1,(barW-2)*ratio,barH-2);
    ctx.strokeStyle='#ff4400'; ctx.lineWidth=1; ctx.strokeRect(bx,by2,barW,barH);
    const fs=Math.max(8,Math.round(SCALE*4));
    ctx.fillStyle='#fff'; ctx.font=`bold ${fs}px Courier New`; ctx.textAlign='center';
    ctx.fillText(`SPIDER MECH  ${this.hp}/${this.maxHp}`,bx+barW/2,by2-2);
    const phaseLabels=['','','★ OVERCLOCKED ★','★ CRITICAL MASS ★'];
    if(this.phase>1){
      ctx.fillStyle='#ff4400'; ctx.font=`bold ${Math.max(7,Math.round(SCALE*3.5))}px Courier New`;
      ctx.fillText(phaseLabels[this.phase],bx+barW/2,by2-fs-2);
    }
    ctx.textAlign='left';
  }
}


class Bullet extends Entity {
  constructor(x,y,vx,vy,enemy,tankShell){
    super(x,y,enemy?10:12,4);
    this.vx=vx; this.vy=vy; this.enemy=enemy; this.tankShell=tankShell;
    this.life=0.9;
  }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.life-=dt; if(this.life<=0) this.alive=false; }
  draw(cam){
    const spr=this.enemy?SPRITES.ebullet:SPRITES.bullet;
    const sx=(this.x-cam.x)*SCALE, sy=(this.y-cam.y)*SCALE;
    ctx.save();
    if(this.vx<0){ ctx.scale(-1,1); ctx.drawImage(spr,-sx-spr.width,sy); }
    else ctx.drawImage(spr,sx,sy);
    ctx.restore();
  }
}

// ── GRENADE ────────────────────────────────────────────────────
class Grenade extends Entity {
  constructor(x,y,vx,vy){ super(x,y,12,14); this.vx=vx; this.vy=vy; this.life=1.4; this.angle=0; }
  update(dt,platforms,game){
    this.life-=dt; if(this.life<=0){ game.explode(this.cx,this.cy); this.alive=false; return; }
    this.angle+=dt*8*Math.sign(this.vx);
    this.vy+=GRAVITY*dt;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // simple ground bounce
    if(this.bottom>=GROUND_Y){ this.y=GROUND_Y-this.h; this.vy*=-0.3; this.vx*=0.6; }
    if(this.x<0){ this.x=0; this.vx=Math.abs(this.vx); }
    if(this.right>WORLD_W){ this.x=WORLD_W-this.w; this.vx=-Math.abs(this.vx); }
  }
  draw(cam){
    const sx=(this.cx-cam.x)*SCALE, sy=(this.cy-cam.y)*SCALE;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(this.angle);
    ctx.drawImage(SPRITES.grenade,-SPRITES.grenade.width/2,-SPRITES.grenade.height/2);
    ctx.restore();
  }
}

// ── EXPLOSION ──────────────────────────────────────────────────
class Explosion {
  constructor(x,y){ this.x=x; this.y=y; this.frame=0; this.timer=0; this.alive=true; }
  update(dt){ this.timer+=dt; if(this.timer>0.07){ this.timer=0; this.frame++; if(this.frame>=5) this.alive=false; } }
  draw(cam){
    const spr=SPRITES.exp[Math.min(this.frame,4)];
    ctx.drawImage(spr,(this.x-spr.width/2/SCALE-cam.x)*SCALE,(this.y-spr.height/2/SCALE-cam.y)*SCALE);
  }
}

// ── PICKUP ─────────────────────────────────────────────────────
class Pickup extends Entity {
  constructor(x,y){ super(x,y,15,15); this.alive=true; }
  draw(cam){ ctx.drawImage(SPRITES.health,(this.x-cam.x)*SCALE,(this.y-cam.y)*SCALE); }
}

// ── FLOAT TEXT ─────────────────────────────────────────────────
class FloatText {
  constructor(x,y,txt,col='#ffff00'){ this.x=x; this.y=y; this.txt=txt; this.col=col; this.life=0.8; this.alive=true; }
  update(dt){ this.y-=40*dt; this.life-=dt; if(this.life<=0) this.alive=false; }
  draw(cam){
    ctx.globalAlpha=Math.max(0,this.life/0.8);
    ctx.fillStyle=this.col; ctx.font=`bold ${Math.max(11,Math.round(SCALE*5.5))}px Courier New`;
    ctx.fillText(this.txt,(this.x-cam.x)*SCALE,(this.y-cam.y)*SCALE);
    ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════
const game = {
  score:0, lives:3,
  stage:1,
  player:null, tank:null,
  enemies:[], bullets:[], grenades:[], explosions:[], pickups:[], floats:[],
  platforms:[],
  cam:{x:0,y:0},
  state:'title', // title | play | dead | win
  shakeTimer:0, shakeMag:0,
  boss:null, boss2:null,

  // ── INIT ──────────────────────────────────────────────────────

  // ── STAGE 2 INIT ─────────────────────────────────────────────
  init(){
    this.stage=2;
    const savedScore=parseInt(sessionStorage.getItem('ms_score')||'0');
    const savedLives=parseInt(sessionStorage.getItem('ms_lives')||'3');
    this.score=savedScore; this.lives=Math.max(1,savedLives);
    this.enemies=[]; this.bullets=[]; this.grenades=[];
    this.explosions=[]; this.pickups=[]; this.floats=[];
    this.platforms=[];
    this.cam={x:0,y:0};
    this.narrative=null;
    this.boss=null;

    // Shorter lab level, more platforms for jumping
    const S2W=3200;
    this.stage2WorldW=S2W;
    this.platforms.push({x:0,y:GROUND_Y,w:S2W,h:50,solid:true,stage2:true});
    const pdefs2=[
      {x:200,y:108,w:140},{x:440,y:95,w:100},{x:620,y:82,w:140},
      {x:820,y:95,w:100},{x:1000,y:108,w:140},{x:1200,y:82,w:120},
      {x:1420,y:95,w:140},{x:1650,y:108,w:100},{x:1880,y:82,w:140},
      {x:2100,y:95,w:120},{x:2320,y:108,w:140},{x:2560,y:82,w:100},
      {x:2780,y:95,w:140},{x:2960,y:108,w:200},
    ];
    pdefs2.forEach(p=>this.platforms.push({x:p.x,y:p.y,w:p.w,h:8,solid:false,stage2:true}));

    // More enemies in stage 2 — faster and tougher
    for(let x=300;x<S2W-500;x+=130+Math.random()*80){
      const e=new Enemy(x,GROUND_Y-22);
      e.hp=2; e.speed=90;
      this.enemies.push(e);
    }

    // More pickups
    for(let x=400;x<S2W-300;x+=400){
      this.pickups.push(new Pickup(x,GROUND_Y-12));
    }

    // Player — always create fresh
    this.player = new Player(80, GROUND_Y-22);
    this.player.hp=3;
    this.player.inTank=false;

    // Tank exists but is disabled in stage 2
    this.tank = new Tank(0, GROUND_Y-32);
    this.tank.alive=false;

    // Boss 2 spawns at end
    this.boss2=new Boss2(S2W-380,GROUND_Y-50);

    this.state='play';
  },

  // ── TANK BOARDING ────────────────────────────────────────────
  boardTank(){
    this.player.inTank=true;
    this.player.alive=true;
    this.cam.follow=this.tank;
  },
  exitTank(){
    this.player.inTank=false;
    this.player.x=this.tank.x-20;
    this.player.y=this.tank.y-24;
    this.player.vx=0; this.player.vy=0;
    this.cam.follow=this.player;
  },

  // ── SPAWN ────────────────────────────────────────────────────
  spawnBullet(x,y,vx,vy,enemy,tank=false){
    this.bullets.push(new Bullet(x,y,vx,vy,enemy,tank));
  },
  spawnGrenade(x,y,vx,vy){ this.grenades.push(new Grenade(x,y,vx,vy)); },

  // ── EXPLODE ──────────────────────────────────────────────────
  explode(x,y){
    this.explosions.push(new Explosion(x,y));
    this.shakeTimer=0.25; this.shakeMag=5;
    this.enemies.forEach(e=>{
      if(!e.alive) return;
      if(Math.hypot(e.cx-x,e.cy-y)<80){ e.alive=false; this.score+=100; this.explosions.push(new Explosion(e.cx,e.cy)); }
    });
    if(this.boss2 && this.boss2.alive && Math.hypot(this.boss2.cx-x,this.boss2.cy-y)<110){
      this.boss2.hit(this);
    }
  },

  // ── NARRATIVE ────────────────────────────────────────────────
  showNarrative(text, color='#ffe94d'){
    this.narrative = { text, color, timer: 3.5 };
  },

  // ── PLAYER DEATH ─────────────────────────────────────────────
  playerDead(){
    this.lives--;
    this.explosions.push(new Explosion(this.player.cx, this.player.cy));
    if(this.lives<=0){ this.state='dead'; showOverlay('MISSION\nFAILED','PRESS ENTER TO RETRY'); return; }
    this.player.hp=3; this.player.invTimer=2;
    this.player.x=Math.max(50,this.player.x-80);
    this.player.y=GROUND_Y-22; this.player.vx=0; this.player.vy=0;
  },

  // ── UPDATE ───────────────────────────────────────────────────
  update(dt){
    if(this.state!=='play') return;
    const plats=this.platforms;

    // Boss 2 encounter trigger
    if(this.boss2 && this.boss2.alive && !this.boss2.narrativeDone){
      const px = this.player.cx;
      if(Math.abs(px - this.boss2.cx) < 700){
        this.boss2.narrativeDone = true;
        this.showNarrative('⚠ EXPERIMENT XB-7 AWAKENING — MAXIMUM THREAT!', '#ff4400');
        setTimeout(()=> this.showNarrative('SPIDER MECH DETECTED — SHIELD BLOCKS ALL DAMAGE!', '#ff8800'), 3800);
      }
    }

    // Camera follow target
    const followX = this.player.inTank ? this.tank.cx : this.player.cx;
    const followY = this.player.inTank ? this.tank.cy : this.player.cy;
    const activeWorldW = 3200;
    const vw = W/SCALE;
    const targetCamX = followX - vw/2;
    this.cam.x += (targetCamX - this.cam.x) * 8 * dt;
    this.cam.x = Math.max(0, Math.min(activeWorldW - vw, this.cam.x));
    this.cam.y = 0; // flat world, no vertical scroll

    // Shake
    if(this.shakeTimer>0){ this.shakeTimer-=dt; }

    // Player
    this.player.update(dt, plats, this);

    // Tank
    if(this.player.inTank && this.tank.alive) this.tank.update(dt,plats,this);

    // Enemies (only near camera)
    const camR=this.cam.x+W/SCALE;
    this.enemies.forEach(e=>{
      if(!e.alive) return;
      if(e.x>this.cam.x-120 && e.x<camR+120) e.update(dt,plats,this);
    });

    // Boss
    if(this.boss2 && this.boss2.alive) this.boss2.update(dt, plats, this);

    // Bullets
    this.bullets.forEach(b=>{ if(b.alive) b.update(dt); });

    // Grenades
    this.grenades.forEach(g=>{ if(g.alive) g.update(dt,plats,this); });

    // Explosions
    this.explosions.forEach(e=>{ if(e.alive) e.update(dt); });

    // Floats
    this.floats.forEach(f=>{ if(f.alive) f.update(dt); });

    // ── COLLISION CHECKS (no recursion, plain loops) ──────────
    // Player bullets vs enemies
    this.bullets.forEach(b=>{
      if(!b.alive || b.enemy) return;
      this.enemies.forEach(e=>{
        if(!e.alive || !b.alive) return;
        if(b.overlaps(e)){
          b.alive=false;
          e.hp -= b.tankShell?2:1;
          if(e.hp<=0){ e.alive=false; this.score+=100; this.explosions.push(new Explosion(e.cx,e.cy)); this.floats.push(new FloatText(e.cx,e.y-10,'+100','#ffff00')); }
        }
      });
      // Player bullets vs boss2
      if(this.boss2 && this.boss2.alive && b.alive && b.overlaps(this.boss2)){
        b.alive=false;
        this.boss2.hit(this);
      }
    });

    // Enemy bullets vs player
    if(!this.player.inTank){
      this.bullets.forEach(b=>{
        if(!b.alive || !b.enemy) return;
        if(b.overlaps(this.player)){ b.alive=false; this.player.hit(this); }
      });
      // Enemy melee vs player
      if(this.player.invTimer<=0){
        this.enemies.forEach(e=>{
          if(!e.alive) return;
          if(e.overlaps(this.player)) this.player.hit(this);
        });
        if(this.boss2 && this.boss2.alive && this.boss2.overlaps(this.player)){
          this.player.hit(this);
        }
      }
    }

    // Tank vs enemies
    if(this.player.inTank && this.tank.alive){
      this.enemies.forEach(e=>{
        if(!e.alive) return;
        if(this.tank.overlaps(e)){ e.alive=false; this.score+=100; this.explosions.push(new Explosion(e.cx,e.cy)); }
      });
      // Tank vs boss
      if(this.boss && this.boss.alive && this.tank.overlaps(this.boss)){
        this.boss.hit(this);
      }
    }

    // Player vs pickups
    this.pickups.forEach(pk=>{
      if(!pk.alive) return;
      if(pk.overlaps(this.player)){ pk.alive=false; this.player.hp=Math.min(3,this.player.hp+1); this.floats.push(new FloatText(pk.cx,pk.y-10,'+HP','#44ff44')); this.score+=50; }
    });

    // Win check — boss must be defeated (handled in FinalBoss.hit)

    // Cleanup dead objects
    this.enemies   = this.enemies.filter(e=>e.alive);
    this.bullets   = this.bullets.filter(b=>b.alive);
    this.grenades  = this.grenades.filter(g=>g.alive);
    this.explosions= this.explosions.filter(e=>e.alive);
    this.pickups   = this.pickups.filter(p=>p.alive);
    this.floats    = this.floats.filter(f=>f.alive);

    // Update score/lives DOM bar
    // Narrative timer
    if(this.narrative){ this.narrative.timer -= dt; if(this.narrative.timer<=0) this.narrative=null; }

    // Score/lives drawn on canvas via drawHUD()
  },

  // ── DRAW ─────────────────────────────────────────────────────
  draw(){
    const cam=this.cam;
    const ox = this.shakeTimer>0 ? (Math.random()-0.5)*this.shakeMag : 0;
    const oy = this.shakeTimer>0 ? (Math.random()-0.5)*this.shakeMag : 0;

    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(ox,oy);

    if(this.state==='title'){
      this.drawTitle();
      ctx.restore(); return;
    }

    // ── SKY / BACKGROUND ──
    const bgImg = window._bgImg;
    if(bgImg && bgImg.naturalWidth>0){
      // Fill full screen height, tile horizontally with parallax
      const bgH = H;
      const bgW = Math.round(bgH * (bgImg.naturalWidth / bgImg.naturalHeight));
      const bgX = -(cam.x * 0.3 * SCALE) % bgW;
      ctx.imageSmoothingEnabled = true;
      for(let tx = bgX - bgW; tx < W + bgW; tx += bgW){
        ctx.drawImage(bgImg, tx, 0, bgW, bgH);
      }
    } else {
      // fallback procedural sky
      const grd=ctx.createLinearGradient(0,0,0,H);
      grd.addColorStop(0,'#000822'); grd.addColorStop(1,'#1a3a88');
      ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

      // ── SUN (parallax 0.05) ──
      ctx.fillStyle='rgba(255,204,0,0.9)';
      ctx.beginPath(); ctx.arc(700-cam.x*0.05,55,28,0,Math.PI*2); ctx.fill();

      // ── FAR MOUNTAINS (parallax 0.15) ──
      ctx.fillStyle='rgba(34,51,85,0.7)';
      for(let mx=0;mx<WORLD_W*0.5;mx+=140){
        const bh=50+((mx*17)%90);
        const sx=(mx-cam.x*0.15)*SCALE;
        ctx.beginPath(); ctx.moveTo(sx,H); ctx.lineTo(sx+90*SCALE,H-bh*SCALE); ctx.lineTo(sx+180*SCALE,H); ctx.fill();
      }

      // ── TREES (parallax 0.45) ──
      ctx.fillStyle='#3a7a1a';
      for(let i=0;i<40;i++){
        const tx=100+i*120+((i*37)%55);
        const sx=(tx-cam.x*0.45)*SCALE;
        if(sx<-40||sx>W+40) continue;
        const th=30+((i*13)%20);
        ctx.fillRect(sx+14,H-th*SCALE,8,(th-10)*SCALE);
        ctx.beginPath(); ctx.arc(sx+18,(H-th*SCALE),18,0,Math.PI*2); ctx.fill();
      }
    }

    // ── PLATFORMS (visual) ──
    this.platforms.forEach(p=>{
      const sx=(p.x-cam.x)*SCALE, sy=(p.y-cam.y)*SCALE;
      const sw=p.w*SCALE, sh=p.h*SCALE;
      if(sx+sw<0||sx>W) return;
      if(p.solid){
        // ground tile
        ctx.fillStyle='#5a4a2a';
        ctx.fillRect(sx,sy,sw,sh);
        ctx.fillStyle='#7a6a4a';
        ctx.fillRect(sx,sy,sw,Math.min(4,sh));
        ctx.fillStyle='rgba(0,0,0,0.2)';
        for(let tx=0;tx<p.w;tx+=8){
          if((Math.floor(tx/8))%3===0) ctx.fillRect(sx+tx*SCALE+2,sy+8,6*SCALE-2,4*SCALE);
        }
      } else {
        // elevated platform — use jump.png if loaded, else fallback color
        const jumpTile = window._jumpTile;
        if(jumpTile && jumpTile.naturalWidth>0){
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          // Draw as single image stretched across full platform — no tiling, no gaps
          ctx.drawImage(jumpTile, Math.floor(sx), Math.floor(sy) - 2, Math.ceil(sw) + 1, Math.ceil(sh) + 4);
          ctx.restore();
        } else {
          ctx.fillStyle='#6a5a3a'; ctx.fillRect(sx,sy,sw,sh);
          ctx.fillStyle='#9a8a6a'; ctx.fillRect(sx,sy,sw,3);
        }
      }
    });

    // ── DECOR (crates/barrels) ──
    for(let i=0;i<30;i++){
      const dx=280+i*160+((i*73)%80);
      const sx=(dx-cam.x)*SCALE;
      if(sx<-40||sx>W+40) continue;
      const spr=i%2?SPRITES.barrel:SPRITES.crate;
      ctx.drawImage(spr,sx,(GROUND_Y-spr.height/SCALE-cam.y)*SCALE);
    }

    // ── TANK HINT ──
    if(!this.player.inTank && this.tank && this.tank.alive){
      const tx=(this.tank.cx-cam.x)*SCALE, ty=(this.tank.y-28-cam.y)*SCALE;
      ctx.fillStyle='#f5a623'; ctx.font=`bold ${Math.max(9,Math.round(SCALE*5))}px Courier New`;
      ctx.textAlign='center'; ctx.fillText('↑ BOARD',tx,ty); ctx.textAlign='left';
    }

    // ── PICKUPS ──
    this.pickups.forEach(pk=>{ if(pk.alive) pk.draw(cam); });

    // ── TANK ──
    if(this.tank && this.tank.alive) this.tank.draw(cam);

    // ── ENEMIES ──
    this.enemies.forEach(e=>{ if(e.alive) e.draw(cam); });

    // ── BOSS ──
    if(this.boss2 && this.boss2.alive) this.boss2.draw(cam);

    // ── PLAYER ──
    if(!this.player.inTank) this.player.draw(cam);

    // ── BULLETS ──
    this.bullets.forEach(b=>{ if(b.alive) b.draw(cam); });

    // ── GRENADES ──
    this.grenades.forEach(g=>{ if(g.alive) g.draw(cam); });

    // ── EXPLOSIONS ──
    this.explosions.forEach(e=>{ if(e.alive) e.draw(cam); });

    // ── FLOAT TEXTS ──
    this.floats.forEach(f=>{ if(f.alive) f.draw(cam); });

    // ── GOAL FLAG ──
    const gx=(WORLD_W-80-cam.x)*SCALE, gy=(GROUND_Y-40-cam.y)*SCALE;
    const flagH=40*SCALE, flagW=12*SCALE;
    ctx.strokeStyle='#f5a623'; ctx.lineWidth=2;
    ctx.strokeRect(gx,gy,flagW,flagH);
    ctx.fillStyle='rgba(245,166,35,0.2)'; ctx.fillRect(gx,gy,flagW,flagH);
    ctx.fillStyle='#f5a623'; ctx.font=`bold ${Math.max(9,Math.round(SCALE*4.5))}px Courier New`;
    ctx.fillText('GOAL',gx+2,gy-4);

    // ── BOSS WARNING ──
    if(this.boss && this.boss.alive){
      const distToBoss = this.boss.x - (this.player.inTank ? this.tank.cx : this.player.cx);
      if(distToBoss < 500 && distToBoss > 0){
        const alpha = Math.min(1, (500-distToBoss)/200);
        ctx.save();
        ctx.globalAlpha = alpha * (0.6 + 0.4*Math.abs(Math.sin(Date.now()/300)));
        ctx.fillStyle='#e63c2f'; ctx.font=`bold ${Math.max(13,Math.round(SCALE*6.5))}px Courier New`; ctx.textAlign='center';
        ctx.fillText('⚠ FINAL BOSS AHEAD ⚠', W/2, Math.round(H*0.12));
        ctx.textAlign='left'; ctx.restore();
      }
    }

    // ── NARRATIVE BOX ──
    if(this.narrative && this.narrative.timer > 0){
      const n = this.narrative;
      const alpha = Math.min(1, n.timer, 3.5 - (3.5 - n.timer < 0.5 ? 0 : 0));
      const fadeIn  = Math.min(1, (3.5 - n.timer) * 4);   // fade in fast
      const fadeOut = n.timer < 0.6 ? n.timer / 0.6 : 1;  // fade out last 0.6s
      const a = Math.min(fadeIn, fadeOut);
      ctx.save();
      ctx.globalAlpha = a;
      const fs = Math.max(13, Math.round(SCALE*6.5));
      ctx.font = `bold ${fs}px Courier New`;
      const tw = ctx.measureText(n.text).width;
      const boxW = tw + 40, boxH = fs + 20;
      const bx = W/2 - boxW/2, by = H/2 - boxH/2;
      // box bg
      ctx.fillStyle='rgba(0,0,0,0.82)';
      ctx.fillRect(bx, by, boxW, boxH);
      // colored border
      ctx.strokeStyle = n.color; ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, boxW, boxH);
      // top accent line
      ctx.fillStyle = n.color; ctx.fillRect(bx, by, boxW, 2);
      ctx.fillRect(bx, by+boxH-2, boxW, 2);
      // text
      ctx.fillStyle = n.color;
      ctx.textAlign = 'center';
      ctx.fillText(n.text, W/2, by + boxH/2 + fs*0.35);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    // ── HUD OVERLAY ──
    this.drawHUD();

    ctx.restore();
  },

  drawHUD(){
    const s = SCALE; // shorthand
    const portraitImg = document.getElementById('char-portrait');
    const activePortrait = (portraitImg && portraitImg.src && portraitImg.naturalWidth>0)
      ? portraitImg : (window._charImg || null);
    const hasPortrait = activePortrait && activePortrait.naturalWidth>0;

    // ── PANEL sizes scale with window ──
    const panelW = Math.round(s*74), panelH = Math.round(s*28);
    const panelX = 8, panelY = 8;

    // panel bg
    ctx.fillStyle='rgba(0,0,0,0.72)';
    ctx.fillRect(panelX, panelY, panelW, panelH);
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1;
    ctx.strokeRect(panelX, panelY, panelW, panelH);
    ctx.fillStyle='#f5a623';
    ctx.fillRect(panelX, panelY, panelW, 2);

    // portrait box
    const portW=Math.round(s*19), portH=Math.round(s*24);
    const portX=panelX+4, portY=panelY+4;
    ctx.fillStyle='#0a0a0a'; ctx.fillRect(portX, portY, portW, portH);
    ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.strokeRect(portX, portY, portW, portH);

    if(hasPortrait){
      ctx.save(); ctx.imageSmoothingEnabled=false;
      if(this.player.invTimer>0 && Math.floor(this.player.invTimer*10)%2===0) ctx.globalAlpha=0.35;
      ctx.drawImage(activePortrait, portX+1, portY+1, portW-2, portH-2);
      ctx.globalAlpha=1; ctx.restore();
      // brackets
      const bl=Math.round(s*2);
      ctx.strokeStyle='rgba(245,166,35,0.5)'; ctx.lineWidth=1.5;
      [[portX,portY,1,1],[portX+portW,portY,-1,1],[portX,portY+portH,1,-1],[portX+portW,portY+portH,-1,-1]].forEach(([x,y,dx,dy])=>{
        ctx.beginPath(); ctx.moveTo(x+dx*bl,y); ctx.lineTo(x,y); ctx.lineTo(x,y+dy*bl); ctx.stroke();
      });
    } else {
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(portX+1,portY+1,portW-2,portH-2);
    }

    // stat area
    const statX=portX+portW+Math.round(s*3), statY=panelY+Math.round(s*3);
    const fs = Math.max(8, Math.round(s*3.5));
    ctx.fillStyle='#f5a623'; ctx.font=`bold ${fs}px Courier New`;
    ctx.fillText('MARCO', statX, statY+fs);

    // HP bar
    const barX=statX+Math.round(s*7), barY=statY+Math.round(s*6), barW=Math.round(s*36), barH=Math.round(s*3.5);
    ctx.fillStyle='#111'; ctx.fillRect(barX, barY, barW, barH);
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1; ctx.strokeRect(barX, barY, barW, barH);
    const hpR=Math.max(0,this.player.hp/3);
    ctx.fillStyle=hpR>0.6?'#4cde6a':hpR>0.3?'#f5a623':'#e63c2f';
    ctx.fillRect(barX+1,barY+1,Math.round((barW-2)*hpR),barH-2);
    ctx.fillStyle='#888'; ctx.font=`${Math.max(7,Math.round(s*3))}px Courier New`;
    ctx.fillText('HP', statX, barY+barH);

    // Grenade pips
    const grnY=barY+barH+Math.round(s*3);
    ctx.fillStyle='#888'; ctx.font=`${Math.max(7,Math.round(s*3))}px Courier New`;
    ctx.fillText('GRN', statX, grnY+Math.round(s*3.5));
    const pipSize=Math.max(4,Math.round(s*3.5)), pipGap=pipSize+2;
    for(let i=0;i<5;i++){
      ctx.fillStyle=i<this.player.grenades?'#88ff88':'#1a1a1a';
      ctx.fillRect(barX+i*pipGap, grnY, pipSize, pipSize);
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1;
      ctx.strokeRect(barX+i*pipGap, grnY, pipSize, pipSize);
    }

    // IN TANK badge
    if(this.player.inTank){
      ctx.fillStyle='rgba(245,166,35,0.2)'; ctx.fillRect(statX,grnY+pipSize+2,Math.round(s*46),Math.round(s*5));
      ctx.fillStyle='#f5a623'; ctx.font=`bold ${Math.max(7,Math.round(s*3.5))}px Courier New`;
      ctx.fillText('[ IN TANK ]', statX+2, grnY+pipSize+Math.round(s*5)+1);
    }

    // ── SCORE — top centre ──
    const scoreFs=Math.max(12,Math.round(s*7));
    ctx.fillStyle='rgba(0,0,0,0.6)';
    const scoreW=Math.round(scoreFs*8.5);
    ctx.fillRect(W/2-scoreW/2-8, 6, scoreW+16, scoreFs+8);
    ctx.fillStyle='#f5a623'; ctx.font=`bold ${scoreFs}px Courier New`;
    ctx.textAlign='center'; ctx.fillText('SCORE: '+this.score, W/2, 8+scoreFs); ctx.textAlign='left';
    // Stage 2 indicator
    const stgFs=Math.max(9,Math.round(SCALE*4.5));
    ctx.fillStyle='#00ff88';
    ctx.font=`bold ${stgFs}px Courier New`; ctx.textAlign='center';
    ctx.fillText('STAGE 2', W/2, 8+scoreFs+stgFs+2);
    ctx.textAlign='left';

    // ── LIVES — top right ──
    const livesFs=Math.max(10,Math.round(s*5));
    const heartSize=Math.max(8,Math.round(s*4.5));
    const heartGap=heartSize+Math.round(s*1.5);
    const livesBg=this.lives*heartGap+Math.round(s*18);
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W-livesBg-8, 6, livesBg+8, heartSize*3+8);
    ctx.fillStyle='#f5a623'; ctx.font=`bold ${livesFs}px Courier New`;
    ctx.textAlign='right'; ctx.fillText('LIVES', W-8, 6+livesFs); ctx.textAlign='left';
    for(let i=0;i<this.lives;i++){
      const lx=W-livesBg+i*heartGap+4, ly=livesFs+10;
      ctx.fillStyle='#e63c2f';
      ctx.fillRect(lx,       ly+Math.round(heartSize*.4), Math.round(heartSize*.45), Math.round(heartSize*.4));
      ctx.fillRect(lx+Math.round(heartSize*.5),ly+Math.round(heartSize*.4), Math.round(heartSize*.45), Math.round(heartSize*.4));
      ctx.fillRect(lx-1,     ly+Math.round(heartSize*.6), heartSize+2, Math.round(heartSize*.3));
      ctx.fillRect(lx,       ly+Math.round(heartSize*.9), Math.round(heartSize*.9), Math.round(heartSize*.2));
      ctx.fillRect(lx+Math.round(heartSize*.1), ly+heartSize+1, Math.round(heartSize*.7), Math.round(heartSize*.15));
    }

    // ── CONTROLS — bottom centre ──
    const ctrlFs=Math.max(9,Math.round(s*4));
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0, H-ctrlFs-10, W, ctrlFs+10);
    ctx.fillStyle='#555'; ctx.font=`${ctrlFs}px Courier New`;
    ctx.textAlign='center';
    ctx.fillText('← → MOVE   ↑/W JUMP   Z/SPC SHOOT   X GRENADE   ↑ near tank BOARD', W/2, H-5);
    ctx.textAlign='left';
  },

  drawTitle(){
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#000'); grd.addColorStop(1,'#001133');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

    const portraitImg=document.getElementById('char-portrait');
    const titleImg=(portraitImg&&portraitImg.src&&portraitImg.naturalWidth>0)
      ?portraitImg:(window._charImg||null);
    const hasP=titleImg&&titleImg.naturalWidth>0;
    if(hasP){
      const ph=Math.round(H*0.65);
      const pw=Math.round(ph*(titleImg.naturalWidth/titleImg.naturalHeight));
      const px2=W/2-pw/2, py2=H/2-ph/2-10;
      ctx.save(); ctx.imageSmoothingEnabled=false;
      ctx.shadowColor='rgba(245,166,35,0.4)'; ctx.shadowBlur=30;
      ctx.drawImage(titleImg,px2,py2,pw,ph);
      ctx.shadowBlur=0; ctx.restore();
    }

    const titleFs=Math.max(24,Math.round(SCALE*18));
    ctx.fillStyle='#f5a623'; ctx.font=`bold ${titleFs}px Courier New`; ctx.textAlign='center';
    ctx.fillText('METAL SLUG', W/2, hasP?Math.round(H*0.12):H/2-40);

    const ctrlFs=Math.max(10,Math.round(SCALE*5));
    ctx.fillStyle='#aaa'; ctx.font=`${ctrlFs}px Courier New`;
    ctx.fillText('← → MOVE   ↑/W JUMP   Z/SPACE SHOOT', W/2, hasP?H-Math.round(SCALE*22):H/2+20);
    ctx.fillText('X GRENADE   ↑ near tank = BOARD TANK', W/2, hasP?H-Math.round(SCALE*14):H/2+35);
    ctx.fillStyle=`rgba(245,166,35,${0.5+0.5*Math.abs(Math.sin(Date.now()/500))})`;
    ctx.font=`bold ${Math.round(ctrlFs*1.2)}px Courier New`;
    ctx.fillText('PRESS ENTER TO START', W/2, hasP?H-Math.round(SCALE*5):H/2+60);
    ctx.textAlign='left';
  }
};

// ═══════════════════════════════════════════════════════════════
// OVERLAY
// ═══════════════════════════════════════════════════════════════
function showOverlay(title,sub){
  document.getElementById('ot').textContent=title;
  document.getElementById('os').textContent=sub;
  document.getElementById('over').classList.add('on');
}
function hideOverlay(){ document.getElementById('over').classList.remove('on'); }

window.addEventListener('keydown', e=>{
  if(e.code!=='Enter') return;
  if(game.state==='title'){ hideOverlay(); game.init(); return; }
  if(game.state==='dead'||game.state==='win'){ hideOverlay(); game.init(); return; }
});

// ═══════════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════════
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000, 0.05);
  last=ts;
  game.update(dt);
  game.draw();
  clearJust();
  requestAnimationFrame(loop);
}

buildSprites();

// ── CHARACTER IMAGES ───────────────────────────────────────────
(function(){
  function loadImg(id, globalKey){
    const el = document.getElementById(id);
    if(el && el.src && el.src !== window.location.href){
      if(el.complete && el.naturalWidth>0){ window[globalKey] = el; }
      else { el.onload = ()=>{ window[globalKey] = el; }; }
    }
  }
  loadImg('player-char', '_charImg');
  loadImg('enemy-char',  '_enemyImgs');
  loadImg('bg-image',    '_bgImg');
  loadImg('jump-tile',   '_jumpTile');
  loadImg('tank-img',    '_tankImg');
  loadImg('boss2-img',   '_boss2Img');

  // Load all 3 enemy images into an array
  window._enemyImgArr = [];
  ['enemy-char','enemy-char2','enemy-char3'].forEach((id,i)=>{
    const el = document.getElementById(id);
    if(el && el.src && el.src !== window.location.href){
      const store = ()=>{ window._enemyImgArr[i] = el; };
      if(el.complete && el.naturalWidth>0) store();
      else el.onload = store;
    }
  });
})();

game.stage=2; game.init();
requestAnimationFrame(ts=>{ last=ts; requestAnimationFrame(loop); });
</script>
</body>
